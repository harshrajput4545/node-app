name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "========== SSH USER CHECK =========="
            whoami
            id

            echo "========== CHECKING REPOSITORY =========="
            ls -ld /var/www/express-app/node-app
            ls -ld /var/www/express-app/node-app/.git
            ls -l /var/www/express-app/node-app/.git/FETCH_HEAD

            echo "========== CONFIGURING GIT =========="
            git config --global --add safe.directory /var/www/express-app/node-app

            cd /var/www/express-app/node-app

            echo "========== CHECKING GIT STATUS =========="
            git status --short

            echo "========== PULLING LATEST CODE =========="
            git pull origin main

            echo "========== INSTALLING DEPENDENCIES =========="
            npm install

            echo "========== CHECKING PM2 =========="
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "========== RESTARTING APPLICATION =========="
            if pm2 describe express-app >/dev/null 2>&1; then
              pm2 restart express-app --update-env
            else
              pm2 start main.js --name express-app
            fi

            pm2 save

            echo "========== TESTING APPLICATION =========="
            curl --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              -fsS http://127.0.0.1:8000/

            echo ""
            echo "========== DEPLOYMENT SUCCESSFUL =========="
