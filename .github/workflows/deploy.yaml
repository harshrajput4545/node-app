name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /var/www/express-app/node-app

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm install

            echo "Checking PM2..."
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "Starting or restarting application..."
            if pm2 describe express-app >/dev/null 2>&1; then
              pm2 restart express-app --update-env
            else
              pm2 start main.js --name express-app
            fi

            pm2 save

            echo "Testing application on port 8000..."
            curl --retry 5 --retry-delay 2 --retry-connrefused \
              -fsS http://127.0.0.1:8000/

            echo "Deployment successful!"
